name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan public files
        shell: pwsh
        run: ./scripts/public-safety-scan.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        run: npm --prefix extension ci

      - name: Audit extension dependencies
        run: npm --prefix extension audit --audit-level=high

      - name: Typecheck extension
        run: npm --prefix extension run typecheck

      - name: Lint extension
        run: npm --prefix extension run lint

      - name: Test extension
        run: npm --prefix extension run test:run

      - name: Build diagnostic extension
        run: npm --prefix extension run build

      - name: Build production extension
        run: npm --prefix extension run build:production

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test backend
        run: dotnet test TeamCityHelper.sln --configuration Release

      - name: Audit backend dependencies
        run: dotnet list TeamCityHelper.sln package --vulnerable --include-transitive --no-restore
