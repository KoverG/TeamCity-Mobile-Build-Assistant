<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title description">
  <title id="title">Как TeamCity Mobile Build Assistant находит мобильную сборку</title>
  <desc id="description">Пять последовательных этапов: параметры поиска, успешные сборки TeamCity, прогрессивные результаты, поиск APK или IPA, действия пользователя.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff4f6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f4214f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#92132f" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="310" rx="24" fill="url(#background)"/>
  <text x="600" y="42" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#171922">Поиск мобильной сборки</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#171922">
    <g filter="url(#shadow)">
      <rect x="38" y="82" width="198" height="170" rx="18" fill="#ffffff" stroke="#ffc0ce"/>
      <rect x="270" y="82" width="198" height="170" rx="18" fill="#ffffff" stroke="#ffc0ce"/>
      <rect x="502" y="82" width="198" height="170" rx="18" fill="#ffffff" stroke="#ffc0ce"/>
      <rect x="734" y="82" width="198" height="170" rx="18" fill="#ffffff" stroke="#ffc0ce"/>
      <rect x="966" y="82" width="198" height="170" rx="18" fill="#ffffff" stroke="#ffc0ce"/>
    </g>
    <g fill="none" stroke="#f4214f" stroke-width="3" marker-end="url(#arrow)">
      <path d="M240 167H260"/>
      <path d="M472 167H492"/>
      <path d="M704 167H724"/>
      <path d="M936 167H956"/>
    </g>
    <g text-anchor="middle">
      <circle cx="137" cy="116" r="18" fill="#f4214f"/>
      <text x="137" y="123" font-size="18" font-weight="700" fill="#ffffff">1</text>
      <text x="137" y="154" font-size="17" font-weight="700">Параметры поиска</text>
      <text x="137" y="181" font-size="13" fill="#626262">Проект • Платформа</text>
      <text x="137" y="202" font-size="13" fill="#626262">Окружение • Задача</text>
      <text x="137" y="223" font-size="13" fill="#626262">или номер сборки</text>

      <circle cx="369" cy="116" r="18" fill="#f4214f"/>
      <text x="369" y="123" font-size="18" font-weight="700" fill="#ffffff">2</text>
      <text x="369" y="154" font-size="17" font-weight="700">TeamCity</text>
      <text x="369" y="181" font-size="13" fill="#626262">Проверяет доступные</text>
      <text x="369" y="202" font-size="13" fill="#626262">успешные сборки</text>

      <circle cx="601" cy="116" r="18" fill="#f4214f"/>
      <text x="601" y="123" font-size="18" font-weight="700" fill="#ffffff">3</text>
      <text x="601" y="154" font-size="17" font-weight="700">Результаты сразу</text>
      <text x="601" y="181" font-size="13" fill="#626262">Карточки появляются,</text>
      <text x="601" y="202" font-size="13" fill="#626262">пока поиск продолжается</text>

      <circle cx="833" cy="116" r="18" fill="#f4214f"/>
      <text x="833" y="123" font-size="18" font-weight="700" fill="#ffffff">4</text>
      <text x="833" y="154" font-size="17" font-weight="700">APK или IPA</text>
      <text x="833" y="181" font-size="13" fill="#626262">Находит пакет</text>
      <text x="833" y="202" font-size="13" fill="#626262">в артефактах и архивах</text>

      <circle cx="1065" cy="116" r="18" fill="#f4214f"/>
      <text x="1065" y="123" font-size="18" font-weight="700" fill="#ffffff">5</text>
      <text x="1065" y="154" font-size="17" font-weight="700">Готово к работе</text>
      <text x="1065" y="181" font-size="13" fill="#626262">Скопировать ссылку</text>
      <text x="1065" y="202" font-size="13" fill="#626262">Открыть • Скачать</text>
    </g>
  </g>
  <text x="600" y="286" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#7e7e7e">TeamCity Mobile Build Assistant</text>
</svg>
